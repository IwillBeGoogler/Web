# Crawlers and link-preview bots get server-rendered meta tags (title,
# description, Open Graph, JSON-LD) from the API; people get the SPA.
map $http_user_agent $is_bot {
    default 0;
    "~*(googlebot|google-inspectiontool|bingbot|yandex|duckduckbot|baiduspider|applebot|petalbot|slurp|telegrambot|twitterbot|facebookexternalhit|facebot|linkedinbot|slackbot|discordbot|whatsapp|pinterest|vkshare|skypeuripreview|redditbot|embedly|quora link preview|mastodon)" 1;
}

# Public scheme behind a TLS-terminating proxy.
map $http_x_forwarded_proto $public_scheme {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    # Docker DNS, re-resolved: a recreated api container gets a new IP and a cached one would 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_URL};
    set $mqtt_upstream ${MQTT_URL};
    server_tokens off;
    root /usr/share/nginx/html;

    # Behind Caddy the peer is the proxy: restore the client address it sent, so $remote_addr below is the real client.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml application/rss+xml;

    # Security headers for the SPA (the API sets its own).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # Server-Sent Events: no buffering, long-lived.
    location ~ ^/api/.*/stream$ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # The MQTT broker's HTTP auth/ACL questions (EMQX -> API, bearer secret) are not public. `^~` so the regex location above
    # (/api/.../stream) cannot hand a crafted path to the API; it also wins over `location /api/` by prefix length.
    location ^~ /api/internal/ {
        return 404;
    }

    # Diagram realtime: MQTT 5 over WebSocket, same origin, routed to EMQX (MQTT_URL, e.g. http://emqx:8083). The path /mqtt is passed through.
    location = /mqtt {
        proxy_pass $mqtt_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 6m;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # robots.txt needs an absolute sitemap URL, so it is built per host.
    # Earth textures (up to 11 MB, names not hashed): the browser keeps them for 30 days and loads them from disk on later visits.
    # After that, or for a replaced file, the ETag revalidates without a new download; the background refresh keeps pages instant.
    location /earth/ {
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=604800";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /me/\nDisallow: /new-story\nDisallow: /p/*/edit\nAllow: /\n\nSitemap: $public_scheme://$http_host/api/sitemap.xml\n";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Host page of live HTML blocks in stories (see Web/src/contexts/reading/ui/HtmlBlock.tsx). Author code runs here, so it gets
    # its own policy instead of the site's: `sandbox` makes the origin opaque even if this URL is opened directly (no cookies,
    # storage or access to the site), and default-src 'none' leaves scripts no network (no connect-src). Images may load over
    # https. add_header in a location replaces the server-level ones, so everything this response needs is here.
    # Keep equal to Web/vite/frameCsp.ts.
    location = /html-frame.html {
        add_header Content-Security-Policy "sandbox allow-scripts; default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; font-src data:; media-src data:; frame-ancestors 'self'; form-action 'none'; base-uri 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # SPA: always revalidate the shell so deploys show up immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; worker-src 'self' blob:" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        if ($is_bot) {
            rewrite ^/(.*)$ /api/prerender/$1 last;
        }
        try_files $uri /index.html;
    }
}
