name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: docker.io/bakhod1r/iwillbegoogler-web
    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        run: echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Vault secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          jwtGithubAudience: iwillbegoogler-vault
          role: iwillbegoogler-production-ci-images
          secrets: |
            kv/data/ci/dockerhub username | DOCKERHUB_USERNAME ;
            kv/data/ci/dockerhub token | DOCKERHUB_TOKEN ;
            kv/data/ci/github dispatch_token | DISPATCH_TOKEN

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE:$TAG"

      - name: Trigger infra deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/bakhod1r/iwillbegoogler-infra/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"service\":\"web\",\"tag\":\"$TAG\"}}"
