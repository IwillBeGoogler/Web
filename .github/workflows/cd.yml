name: CD

# main -> production: CI -> image (short sha) -> Trivy -> GHCR -> deploy on the server (self-hosted runner).
# dev runs CI only (ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    permissions:
      contents: read
      packages: write # GHCR push with GITHUB_TOKEN
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      IMAGE: ghcr.io/iwillbegoogler/iwillbegoogler-web
    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: tag
        run: |
          echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push image
        run: docker push "$IMAGE:$TAG"

  # Roll out on the server: self-hosted runner there (label iwillbegoogler-prod, deploy user), plain docker pull/run,
  # no compose and no Vault (nothing secret in the container). The old container is restored if the new one is not healthy.
  deploy:
    needs: publish
    runs-on: [iwillbegoogler-prod] # runner has no `self-hosted` label (registered with --no-default-labels)
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      packages: read # ghcr.io pull
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: GHCR login (pull)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTOR: ${{ github.actor }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Deploy web
        env:
          SERVICE: web
          IMAGE: ghcr.io/iwillbegoogler/iwillbegoogler-web
          TAG: ${{ needs.publish.outputs.tag }}
          MEMORY: 64m
          CPUS: "0.5"
          CONTAINER_ENV: |
            API_URL=http://api:8080
            MQTT_URL=http://emqx:8083
        run: bash .github/scripts/deploy-docker.sh

      - name: GHCR logout
        if: always()
        run: docker logout ghcr.io || true

  # One Telegram message with the result (never fails the run). Needs TELEGRAM_CHAT_ID / TELEGRAM_TOPIC_ID vars and the
  # TELEGRAM_BOT_TOKEN secret in the `production` environment of this repo.
  notify:
    needs: [ci, publish, deploy]
    if: always()
    uses: ./.github/workflows/_notify.yml
    with:
      environment: production
      mode: cd
      results: ${{ toJSON(needs) }}
      tag: ${{ needs.publish.outputs.tag }}
      health-url: https://iwillbegoogler.uz
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
