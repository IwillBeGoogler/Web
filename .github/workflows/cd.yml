name: CD

# main -> production: CI -> image (short sha) -> Trivy -> Docker Hub -> deploy on the server (self-hosted runner).
# dev runs CI only (ci.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    permissions:
      contents: read
      id-token: write
    env:
      ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      IMAGE: docker.io/bakhod1r/iwillbegoogler-web
    steps:
      - uses: actions/checkout@v5

      - name: Short SHA
        id: tag
        run: |
          echo "TAG=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.TAG }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Vault secrets
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          jwtGithubAudience: iwillbegoogler-vault
          role: iwillbegoogler-ci-images
          secrets: |
            kv/data/ci/dockerhub username | DOCKERHUB_USERNAME ;
            kv/data/ci/dockerhub token | DOCKERHUB_TOKEN

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Push image
        run: docker push "$IMAGE:$TAG"

  # Roll out on the server: self-hosted runner there (label iwillbegoogler-prod, deploy user). GitHub OIDC -> Vault role
  # iwillbegoogler-production-ci -> /opt/iwillbegoogler/deploy/server/ci-deploy.sh (fresh wrapped secret_id, deploy.sh with
  # health check and automatic rollback, old secret_ids destroyed). The stack files on the server come from Backend/infra.
  deploy:
    needs: publish
    runs-on: [iwillbegoogler-prod] # runner has no `self-hosted` label (registered with --no-default-labels)
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Vault login (GitHub OIDC)
        uses: hashicorp/vault-action@v3.4.0
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          path: jwt
          role: iwillbegoogler-production-ci
          jwtGithubAudience: iwillbegoogler-vault
          exportToken: true

      - name: Deploy web
        env:
          ENV_NAME: production
          SERVICE: web
          TAG: ${{ needs.publish.outputs.tag }}
        run: bash /opt/iwillbegoogler/deploy/server/ci-deploy.sh
