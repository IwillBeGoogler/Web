name: CI

# Self-contained: the diagram editor lives in ./editor, nothing is checked out from another repository.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      # blog tests, then the embedded editor's own tests (editor/)
      - run: bun run test
      # the hand-written diagram-editor.d.ts must still match editor/src/embed.tsx
      - name: Editor types match
        run: bun run typecheck:editor
      - run: bun run build

  # The production image; context is this repository (Web/ in the workspace).
  image:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          tags: iwillbegoogler-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
